<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title description">
  <title id="title">Текущая архитектура Job AI Assistant</title>
  <desc id="description">Web-клиент обращается к NestJS API. API сохраняет данные в PostgreSQL и ставит задания только с идентификаторами в PgBoss. Worker загружает снимки данных, выполняет отдельные AI-сценарии и сохраняет результаты.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6674f6" />
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#17213a" flood-opacity="0.08" />
    </filter>
  </defs>

  <rect width="1200" height="900" rx="28" fill="#f7f9fc" />
  <rect x="1" y="1" width="1198" height="898" rx="27" fill="none" stroke="#d9dfeb" stroke-width="2" />

  <text x="72" y="82" fill="#171d2b" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="46" font-weight="750">Текущая архитектура</text>
  <text x="72" y="122" fill="#687187" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22">Модульный монолит · асинхронные AI-задачи</text>

  <g filter="url(#shadow)">
    <rect x="72" y="170" width="280" height="140" rx="18" fill="#ffffff" stroke="#cbd3e2" stroke-width="2" />
    <rect x="460" y="170" width="280" height="140" rx="18" fill="#ffffff" stroke="#6674f6" stroke-width="3" />
    <rect x="848" y="170" width="280" height="140" rx="18" fill="#ffffff" stroke="#cbd3e2" stroke-width="2" />

    <rect x="170" y="414" width="300" height="140" rx="18" fill="#ffffff" stroke="#cbd3e2" stroke-width="2" />
    <rect x="730" y="414" width="300" height="140" rx="18" fill="#ffffff" stroke="#6674f6" stroke-width="3" />

    <rect x="72" y="658" width="704" height="152" rx="18" fill="#111827" stroke="#2a3449" stroke-width="2" />
    <rect x="848" y="658" width="280" height="152" rx="18" fill="#ffffff" stroke="#cbd3e2" stroke-width="2" />
  </g>

  <text x="100" y="209" fill="#6674f6" font-family="IBM Plex Mono, Consolas, monospace" font-size="16" font-weight="700" letter-spacing="1">ИНТЕРФЕЙС</text>
  <text x="100" y="263" fill="#171d2b" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="40" font-weight="750">React + Vite</text>

  <text x="488" y="209" fill="#6674f6" font-family="IBM Plex Mono, Consolas, monospace" font-size="16" font-weight="700" letter-spacing="1">APPLICATION</text>
  <text x="488" y="263" fill="#171d2b" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="40" font-weight="750">NestJS API</text>

  <text x="876" y="209" fill="#6674f6" font-family="IBM Plex Mono, Consolas, monospace" font-size="16" font-weight="700" letter-spacing="1">ДАННЫЕ</text>
  <text x="876" y="263" fill="#171d2b" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="38" font-weight="750">PostgreSQL</text>

  <text x="198" y="453" fill="#6674f6" font-family="IBM Plex Mono, Consolas, monospace" font-size="16" font-weight="700" letter-spacing="1">ОЧЕРЕДЬ</text>
  <text x="198" y="507" fill="#171d2b" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="40" font-weight="750">PgBoss</text>

  <text x="758" y="453" fill="#6674f6" font-family="IBM Plex Mono, Consolas, monospace" font-size="16" font-weight="700" letter-spacing="1">BACKGROUND</text>
  <text x="758" y="507" fill="#171d2b" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="40" font-weight="750">Worker</text>

  <text x="102" y="700" fill="#a5adff" font-family="IBM Plex Mono, Consolas, monospace" font-size="17" font-weight="700" letter-spacing="1">AI WORKFLOWS</text>
  <text x="102" y="770" fill="#ffffff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="750">Initial analysis · HR preparation · Post-interview</text>

  <text x="876" y="700" fill="#6674f6" font-family="IBM Plex Mono, Consolas, monospace" font-size="16" font-weight="700" letter-spacing="1">AI BOUNDARY</text>
  <text x="876" y="754" fill="#171d2b" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="38" font-weight="750">LLM adapter</text>
  <text x="876" y="789" fill="#687187" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19">Private prompts</text>

  <g fill="none" stroke="#6674f6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)">
    <path d="M 352 240 H 444" />
    <path d="M 740 240 H 832" />
    <path d="M 600 310 V 362 H 320 V 398" />
    <path d="M 470 484 H 714" />
    <path d="M 880 554 V 606 H 424 V 642" />
    <path d="M 776 734 H 832" />
  </g>

  <path d="M 988 310 V 362 H 880 V 398" fill="none" stroke="#98a3b8" stroke-width="3" stroke-dasharray="8 8" stroke-linecap="round" marker-start="url(#arrow)" marker-end="url(#arrow)" />

  <rect x="520" y="466" width="164" height="36" rx="18" fill="#eef0ff" stroke="#a5adff" />
  <text x="602" y="491" fill="#4652c6" font-family="IBM Plex Mono, Consolas, monospace" font-size="17" font-weight="700" text-anchor="middle">ТОЛЬКО ID</text>

  <circle cx="72" cy="856" r="5" fill="#2da36b" />
  <text x="88" y="864" fill="#566076" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21">Исходный текст резюме не передаётся в LLM</text>
</svg>
