services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-job_ai_assistant}
      POSTGRES_USER: ${POSTGRES_USER:-job_ai_assistant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  api:
    build:
      context: .
      target: api
    command: >-
      sh -c "npm run prisma:migrate:deploy && npm run start:api"
    environment:
      NODE_ENV: production
      PORT: 3000
      POSTGRES_DB: ${POSTGRES_DB:-job_ai_assistant}
      POSTGRES_USER: ${POSTGRES_USER:-job_ai_assistant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      BETTER_AUTH_URL: ${PUBLIC_ORIGIN:-http://localhost}
      WEB_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      AUTH_EMAIL_FROM: ${AUTH_EMAIL_FROM:-}
      AUTH_CLIENT_IP_HEADER: x-real-ip
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  web:
    build:
      context: .
      target: web
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      target: api
    command: >-
      sh -c "npm run prisma:migrate:deploy && npm run start:worker"
    environment:
      NODE_ENV: production
      POSTGRES_DB: ${POSTGRES_DB:-job_ai_assistant}
      POSTGRES_USER: ${POSTGRES_USER:-job_ai_assistant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_MOCK: ${LLM_MOCK:-}
      ANALYSIS_MODE: ${ANALYSIS_MODE:-}
      MAX_REVISION_CYCLES: ${MAX_REVISION_CYCLES:-}
      LLM_STEP_TIMEOUT_MS: ${LLM_STEP_TIMEOUT_MS:-}
      ANALYSIS_TOTAL_TIMEOUT_MS: ${ANALYSIS_TOTAL_TIMEOUT_MS:-}
      LLM_MAX_OUTPUT_TOKENS_ANALYST: ${LLM_MAX_OUTPUT_TOKENS_ANALYST:-}
      LLM_MAX_OUTPUT_TOKENS_PRODUCER: ${LLM_MAX_OUTPUT_TOKENS_PRODUCER:-}
      LLM_MAX_OUTPUT_TOKENS_CRITIC: ${LLM_MAX_OUTPUT_TOKENS_CRITIC:-}
      LLM_MAX_OUTPUT_TOKENS_ORCHESTRATOR_FINAL: ${LLM_MAX_OUTPUT_TOKENS_ORCHESTRATOR_FINAL:-}
    volumes:
      # Local-only private prompt overlay. The compiled files are produced by
      # `npm run build:legacy` and are never copied into the Docker image.
      - ./dist/prompts:/workspace/dist/prompts:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
