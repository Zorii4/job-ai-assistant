services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-job_ai_assistant}
      POSTGRES_USER: ${POSTGRES_USER:-job_ai_assistant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: npm run dev:api
    environment:
      PORT: 3000
      WEB_ORIGIN: http://localhost:5173
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      - .:/workspace
      - node-modules:/workspace/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: npm run dev:web
    environment:
      VITE_API_BASE_URL: http://localhost:${API_PORT:-3000}
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - .:/workspace
      - node-modules:/workspace/node_modules
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  node-modules:
